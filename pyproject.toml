[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echobook"
version = "0.1.0"
description = "Add synced audio narration to EPUBs"
requires-python = ">=3.10"
dependencies = ["lxml", "nltk"]

[project.optional-dependencies]
dev = ["pytest"]
align = ["whisperx"]

[project.scripts]
echobook = "echobook.cli:main"
echopage = "echobook.cli:main"

[tool.setuptools]
packages = ["echobook"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:pyannote\\.audio\\..*",
]
